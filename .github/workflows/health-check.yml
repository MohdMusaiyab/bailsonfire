name: Health Check & Keep-Alive Ping

on:
  schedule:
    # Runs daily every 24 hours at 00:00 UTC
    - cron: "0 0 * * *"

  workflow_dispatch:

jobs:
  ping-health-endpoint:
    runs-on: ubuntu-latest

    steps:
      - name: Ping Health Check API
        run: |
          response=$(curl -s -w "\n%{http_code}" https://bailsonfire.vercel.app/api/health)
          http_code=$(echo "$response" | tail -n1)
          body=$(echo "$response" | sed '$d')
          echo "Response Body: $body"
          if [ "$http_code" -eq 200 ]; then
            echo "✅ Health check passed with HTTP 200!"
            exit 0
          else
            echo "❌ Health check failed with HTTP $http_code"
            exit 1
          fi
